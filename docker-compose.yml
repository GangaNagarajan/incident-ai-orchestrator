services:

  postgres:
    image: postgres:16
    container_name: incident-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incident_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: incident-ai-orchestrator

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/incident_db

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    command:
      uvicorn app.main:app --host 0.0.0.0 --port 8000


volumes:

  postgres_data: